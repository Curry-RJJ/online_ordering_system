<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>设置位置 - 美团外卖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── 顶部导航 ── */
        .top-bar {
            background: linear-gradient(135deg, #ffd900 0%, #ff8800 50%, #ff6b35 100%);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            flex-shrink: 0;
            z-index: 100;
        }
        .top-bar .brand {
            font-size: 1.3rem;
            font-weight: 800;
            color: #1e293b;
        }
        .top-bar .brand i { margin-right: 8px; }
        .top-bar .step-hint {
            font-size: 0.85rem;
            color: #334155;
            background: rgba(255,255,255,0.4);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* ── 主体：左侧说明 + 右侧地图 ── */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧提示面板 */
        .side-panel {
            width: 340px;
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 28px 24px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.06);
            z-index: 10;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .side-panel .panel-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .side-panel .panel-desc {
            font-size: 0.88rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* 搜索框 */
        .search-wrap {
            position: relative;
            margin-bottom: 16px;
        }
        .search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }
        #amap-search-input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }
        #amap-search-input:focus { border-color: #ffd900; }

        /* 自动定位按钮 */
        .btn-locate {
            width: 100%;
            padding: 11px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .btn-locate:hover {
            background: #fffbeb;
            border-color: #ffd900;
            color: #92400e;
        }
        .btn-locate.loading { opacity: 0.6; pointer-events: none; }

        /* 当前地址显示 */
        .address-card {
            background: #fffbeb;
            border: 1.5px solid #fde68a;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
            min-height: 72px;
        }
        .address-card .addr-label {
            font-size: 11px;
            color: #92400e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .address-card .addr-text {
            font-size: 14px;
            color: #1e293b;
            line-height: 1.5;
        }
        .address-card .addr-placeholder {
            font-size: 13px;
            color: #94a3b8;
        }

        /* 坐标小字 */
        .coords-display {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 确认按钮 */
        .btn-confirm {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd900, #ff8800);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: auto;
        }
        .btn-confirm:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255,136,0,0.4);
        }
        .btn-confirm:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ── 地图区域 ── */
        .map-container {
            flex: 1;
            position: relative;
        }
        #amap-div {
            width: 100%;
            height: 100%;
        }

        /* 地图中心十字准星 */
        .map-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 50;
        }
        .map-crosshair::before,
        .map-crosshair::after {
            content: '';
            position: absolute;
            background: #ff6b35;
        }
        .map-crosshair::before {
            width: 2px; height: 24px;
            top: -12px; left: -1px;
        }
        .map-crosshair::after {
            width: 24px; height: 2px;
            left: -12px; top: -1px;
        }

        /* 响应式：小屏竖排 */
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .side-panel { width: 100%; height: auto; overflow: visible; padding: 16px; }
            .map-container { height: 45vh; }
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="top-bar">
        <div class="brand">
            <i class="fas fa-utensils"></i>美团外卖
        </div>
        <div class="step-hint">
            <i class="fas fa-map-marker-alt me-1"></i>第一步：设置您的位置
        </div>
    </div>

    <!-- Flash 消息 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div id="flash-messages" style="display:none;">
        {% for category, message in messages %}
        <div data-type="{{ 'danger' if category == 'error' else category }}" data-message="{{ message }}"></div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <!-- 主体 -->
    <div class="main-layout">
        <!-- 左侧操作面板 -->
        <div class="side-panel">
            <div class="panel-title">
                <i class="fas fa-location-arrow me-2" style="color:#ff8800;"></i>选择您的位置
            </div>
            <div class="panel-desc">
                我们根据您的位置为您推荐附近10公里内的餐厅。<br>
                您可以在右侧地图上点击或拖动大头针，也可以在下方搜索地址。
            </div>

            <!-- 搜索框 -->
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input id="amap-search-input" type="text" placeholder="搜索小区、写字楼、地标…" autocomplete="off">
            </div>

            <!-- 自动定位 -->
            <button class="btn-locate" id="btn-auto-locate">
                <i class="fas fa-crosshairs"></i>
                <span id="locate-text">使用当前位置</span>
            </button>

            <!-- 当前选中地址 -->
            <div class="address-card">
                <div class="addr-label"><i class="fas fa-map-marker-alt me-1"></i>当前选择位置</div>
                <div id="addr-display" class="addr-placeholder">请在地图上选择位置…</div>
            </div>

            <!-- 坐标 -->
            <div class="coords-display" id="coords-display"></div>

            <!-- 确认表单 -->
            <form method="POST" action="{{ url_for('location.setup_location') }}" id="location-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="latitude"  id="input-lat">
                <input type="hidden" name="longitude" id="input-lng">
                <input type="hidden" name="address"   id="input-address">
                <button type="submit" class="btn-confirm" id="btn-confirm" disabled>
                    <i class="fas fa-check-circle me-2"></i>确认位置，开始点餐
                </button>
            </form>
        </div>

        <!-- 右侧地图 -->
        <div class="map-container">
            <div id="amap-div"></div>
            <div class="map-crosshair"></div>
        </div>
    </div>

    <!-- 高德地图 JS API v2 -->
    <script>
        window._AMapSecurityConfig = { securityJsCode: '{{ amap_js_security_key }}' };
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key={{ amap_js_key }}&plugin=AMap.Geolocation,AMap.AutoComplete,AMap.Geocoder"></script>
    <script src="{{ url_for('static', filename='js/amap_picker.js') }}"></script>

    <script>
    // Toast
    function showToast(message, type) {
        const colors = { success:'#10b981', danger:'#ef4444', warning:'#f59e0b', info:'#3b82f6' };
        const icons  = { success:'check-circle', danger:'exclamation-circle', warning:'exclamation-triangle', info:'info-circle' };
        const t = document.createElement('div');
        t.style.cssText = `position:fixed;top:80px;right:20px;z-index:999999;min-width:300px;
            background:${colors[type]||colors.info};color:#fff;padding:16px 20px;border-radius:12px;
            box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;font-size:14px;`;
        t.innerHTML = `<i class="fas fa-${icons[type]||icons.info}" style="font-size:18px;"></i>
            <span style="flex:1;">${message}</span>
            <button onclick="this.parentElement.remove()" style="background:rgba(255,255,255,.2);border:none;
            color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;">×</button>`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Flash 消息
        const flashWrap = document.getElementById('flash-messages');
        if (flashWrap) {
            flashWrap.querySelectorAll('div[data-type]').forEach(el => {
                showToast(el.dataset.message, el.dataset.type);
            });
        }

        // 初始化地图选点组件
        const picker = new AmapPicker('amap-div', {
            onSelect(lat, lng, address) {
                document.getElementById('input-lat').value     = lat;
                document.getElementById('input-lng').value     = lng;
                document.getElementById('input-address').value = address;
                document.getElementById('addr-display').textContent = address || '坐标：' + lat.toFixed(6) + ', ' + lng.toFixed(6);
                document.getElementById('addr-display').className   = 'addr-text';
                document.getElementById('coords-display').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                document.getElementById('btn-confirm').disabled = !address && !(lat && lng);
            }
        });
        picker.init();

        // 自动定位
        document.getElementById('btn-auto-locate').addEventListener('click', function () {
            const btn  = this;
            const text = document.getElementById('locate-text');
            btn.classList.add('loading');
            text.textContent = '定位中…';

            picker.autoLocate(
                function (lat, lng, address) {
                    btn.classList.remove('loading');
                    text.textContent = '使用当前位置';
                    showToast('定位成功：' + address, 'success');
                },
                function () {
                    btn.classList.remove('loading');
                    text.textContent = '使用当前位置';
                    showToast('自动定位失败，请手动在地图上选点或搜索地址', 'warning');
                }
            );
        });
    });
    </script>

    <style>
    @keyframes slideIn { from{transform:translateX(400px);opacity:0} to{transform:translateX(0);opacity:1} }
    </style>
</body>
</html>
