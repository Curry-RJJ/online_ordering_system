{% block scripts %}
<script>
    window._AMapSecurityConfig = { securityJsCode: '{{ amap_js_security_key }}' };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key={{ amap_js_key }}&plugin=AMap.Geolocation,AMap.AutoComplete,AMap.PlaceSearch,AMap.Geocoder"></script>
<script src="{{ url_for('static', filename='js/amap_picker.js') }}"></script>
<script>
(function () {
    let pickerInited = false;
    let picker = null;
    let pendingLat = null, pendingLng = null, pendingAddr = '';

    const modal = document.getElementById('addMapModal');

    // ????
    document.getElementById('btn-open-add-map').addEventListener('click', function () {
        bootstrap.Modal.getOrCreateInstance(modal).show();
    });

    // ??????????????????
    modal.addEventListener('shown.bs.modal', function () {
        if (pickerInited) return;
        pickerInited = true;
        picker = new AmapPicker('add-modal-map-div', {
            searchInputId: 'add-modal-search',
            onSelect(lat, lng, address) {
                pendingLat  = lat;
                pendingLng  = lng;
                pendingAddr = address;
                document.getElementById('add-modal-addr-display').textContent =
                    '???' + (address || lat.toFixed(5) + ', ' + lng.toFixed(5));
                document.getElementById('add-modal-btn-confirm').disabled = false;
            }
        });
        picker.init();

        document.getElementById('add-modal-btn-locate').addEventListener('click', function () {
            this.disabled = true;
            picker.autoLocate(
                () => { this.disabled = false; },
                () => { this.disabled = false; }
            );
        });
    });

    // ???? ? ???????????
    document.getElementById('add-modal-btn-confirm').addEventListener('click', function () {
        if (pendingLat === null) return;
        document.getElementById('latitude').value  = pendingLat;
        document.getElementById('longitude').value = pendingLng;
        document.getElementById('add-coords-display').innerHTML =
            '<i class="fas fa-check-circle text-success me-1"></i>' +
            (pendingAddr || '') + ' (' + pendingLat.toFixed(5) + ', ' + pendingLng.toFixed(5) + ')';
        const addrInput = document.getElementById('address');
        if (!addrInput.value && pendingAddr) addrInput.value = pendingAddr;
        bootstrap.Modal.getOrCreateInstance(modal).hide();
    });

    // ?????????
    document.querySelector('form').addEventListener('submit', function (e) {
        if (!document.getElementById('latitude').value) {
            e.preventDefault();
            document.getElementById('add-modal-addr-display').innerHTML =
                '<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i>????????????</span>';
            bootstrap.Modal.getOrCreateInstance(modal).show();
        }
    });
})();
</script>
