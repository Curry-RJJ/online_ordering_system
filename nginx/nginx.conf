# =============================================================
# 在线订餐系统 Nginx 配置 - HTTPS 版本
# 域名：beautyteam.sztu1881.com
# 证书：Let's Encrypt（Certbot 自动续期）
# =============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 16M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Docker Compose 内网：通过 Docker DNS 动态解析 web 容器地址
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── HTTP：仅处理 ACME 证书验证，其余全部跳转 HTTPS ──────────────
    server {
        listen 80;
        server_name beautyteam.sztu1881.com;

        # Certbot webroot 验证路径
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其余请求 301 跳转 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS：主应用 ────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name beautyteam.sztu1881.com;
        set $flask_upstream http://web:5000;

        # Let's Encrypt 证书
        ssl_certificate     /etc/letsencrypt/live/beautyteam.sztu1881.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/beautyteam.sztu1881.com/privkey.pem;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS（告知浏览器以后只用 HTTPS）
        add_header Strict-Transport-Security "max-age=31536000" always;

        # 安全响应头
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # 静态文件直出（无内容 hash 的 css/js：短缓存，发版后较快生效）
        location /static/ {
            alias /app/app/static/;
            expires 1h;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # 带内容 hash 的构建产物可放在 static/dist/，长缓存 + immutable（性能优化方案 P1 6.1）
        location /static/dist/ {
            alias /app/app/static/dist/;
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 健康检查
        location /health {
            proxy_pass $flask_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 主应用代理
        location / {
            proxy_pass $flask_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }
    }
}
