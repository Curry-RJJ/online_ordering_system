# =============================================================
# 在线订餐系统 Nginx 配置
# 使用前替换所有 <your-domain.com> 为真实域名
# SSL 证书路径根据 Certbot 实际生成路径调整
# =============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 16M;  # 允许最大 16MB 上传（图片上传用）

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ── upstream：Flask Gunicorn 应用 ─────────────────────────
    upstream flask_app {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # ── HTTP → HTTPS 强制跳转 ──────────────────────────────────
    server {
        listen 80;
        server_name <your-domain.com> www.<your-domain.com>;

        # Let's Encrypt 证书申请验证路径（certbot 使用）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS 主服务 ───────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name <your-domain.com> www.<your-domain.com>;

        # SSL 证书（Certbot 自动生成路径，替换域名部分）
        ssl_certificate     /etc/letsencrypt/live/<your-domain.com>/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/<your-domain.com>/privkey.pem;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS（告诉浏览器以后只用 HTTPS，谨慎开启，确认 HTTPS 稳定后再加）
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # 安全响应头
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # ── 静态文件直出（不经过 Flask，性能更好）────────────
        location /static/ {
            alias /app/app/static/;
            expires 1h;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # ── 健康检查（内部监控使用，不暴露给公网可选限制 IP）──
        location /health {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 可选：只允许内网访问
            # allow 127.0.0.1;
            # deny all;
        }

        # ── 主应用代理 ─────────────────────────────────────────
        location / {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # 超时设置
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            # 缓冲区（防止慢客户端占用 Gunicorn worker）
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }
    }
}
