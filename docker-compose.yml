version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: online_ordering_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meituan_waimai}
      MYSQL_USER: ${MYSQL_USER:-meituan_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-meituan_pass}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"  # 映射到3307避免与本地MySQL冲突
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init_mysql_data.py:/docker-entrypoint-initdb.d/init_data.py:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存服务
  redis:
    image: redis:7.2-alpine
    container_name: online_ordering_redis
    restart: always
    volumes:
      - redis_data:/data
    # 生产环境通过 .env 设置 REDIS_PASSWORD；本地开发留空则无密码
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ];
             then redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\";
             else redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru;
             fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      - app_network
    healthcheck:
      # 无密码时直接 ping；有密码时带 -a 参数认证
      test: ["CMD", "sh", "-c", "redis-cli ping 2>/dev/null || redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask应用服务
  web:
    build: .
    container_name: online_ordering_web
    restart: always
    environment:
      # Flask配置
      FLASK_APP: run.py
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      
      # MySQL数据库配置
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-meituan_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-meituan_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meituan_waimai}
      
      # 数据库URL（会自动使用上面的配置）
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-meituan_user}:${MYSQL_PASSWORD:-meituan_pass}@mysql:3306/${MYSQL_DATABASE:-meituan_waimai}?charset=utf8mb4
      
      # Redis配置（有密码时格式为 redis://:密码@redis:6379/0）
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # 高德地图 API Key
      AMAP_JS_KEY: ${AMAP_JS_KEY:-}
      AMAP_JS_SECURITY_KEY: ${AMAP_JS_SECURITY_KEY:-}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}

      TZ: Asia/Shanghai
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      # 持久化上传的图片
      - ./app/static/images:/app/app/static/images
      # 持久化数据库文件（如果使用SQLite）
      - ./instance:/app/instance
      # 持久化日志
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ── Celery Worker：执行异步任务（新订单通知、状态变更通知）────────
  celery_worker:
    build: .
    container_name: online_ordering_celery_worker
    restart: always
    # 覆盖 entrypoint，直接启动 Celery Worker
    entrypoint: ["celery", "-A", "celery_worker.celery", "worker",
                 "--loglevel=info", "--concurrency=2"]
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-meituan_user}:${MYSQL_PASSWORD:-meituan_pass}@mysql:3306/${MYSQL_DATABASE:-meituan_waimai}?charset=utf8mb4
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ── Celery Beat：定时任务调度器（每小时清理过期订单）──────────────
  celery_beat:
    build: .
    container_name: online_ordering_celery_beat
    restart: always
    entrypoint: ["celery", "-A", "celery_worker.celery", "beat",
                 "--loglevel=info", "--scheduler=celery.beat:PersistentScheduler",
                 "--schedule=/app/logs/celerybeat-schedule"]
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-meituan_user}:${MYSQL_PASSWORD:-meituan_pass}@mysql:3306/${MYSQL_DATABASE:-meituan_waimai}?charset=utf8mb4
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TZ: Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  # ── Nginx 反向代理 ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: online_ordering_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/app/static:ro
      - ./logs/nginx:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - app_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  app_network:
    driver: bridge

